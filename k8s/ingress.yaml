apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-native-api-ingress
  labels:
    app: cloud-native-api
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloud-native-api-svc
                port:
                  number: 80